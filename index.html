<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو التلوين</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#fef7ef;margin:0;padding:15px}
.box{max-width:650px;margin:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 40px #0001}
h1{text-align:center;color:#ff5a1f;margin:0 0 10px}
textarea{width:100%;height:90px;border:2px solid #ffd3b6;border-radius:14px;padding:12px;font-size:16px}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#ff5a1f;color:#fff;font-weight:bold;font-size:17px;margin-top:10px}
img#out{width:100%;border-radius:16px;border:2px dashed #ffb78a;margin-top:15px;display:none}
</style>
</head>
<body>
<div class="box">
<h1>🎨 استوديو التلوين</h1>
<textarea id="pr" placeholder="اكتب مثلا: قطة كيوت لابسة قبعة ساحر"></textarea>
<button class="btn" onclick="gen()">✨ إنشاء صفحة التلوين</button>
<img id="out">
<button class="btn" id="dl" style="display:none;background:#111" onclick="saveImg()">📥 تحميل الصورة</button>
</div>
<script>
function gen(){
let t=document.getElementById('pr').value||'cute kitten';
let prompt='coloring book page black white line art thick bold outline simple cute white background no shading '+t;
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1024&height=1024&nologo=true&seed='+Math.floor(Math.random()*99999);
let im=document.getElementById('out');
im.style.display='block';
im.src=url;
document.getElementById('dl').style.display='block';
}
function saveImg(){
let a=document.createElement('a');
a.href=document.getElementById('out').src;
a.download='coloring-page.png';
a.click();
}
</script>
</body>
</html>
